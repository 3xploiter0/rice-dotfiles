conky.config = {
  alignment = 'top_right', gap_x = 28, gap_y = 60,
  minimum_width = 260, maximum_width = 260,
  own_window = true, own_window_type = 'desktop',
  own_window_transparent = true, own_window_argb_visual = true, own_window_argb_value = 0,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  double_buffer = true, update_interval = 1.5,
  draw_shades = false, draw_outline = false, draw_borders = false,
  use_xft = true, font = 'JetBrainsMono Nerd Font:size=9',
  default_color = 'a9b1d6', color1 = '7aa2f7', color2 = '7dcfff', color3 = 'bb9af7', color4 = 'f7768e',
  border_inner_margin = 12,
};
conky.text = [[
${alignr}${font JetBrainsMono Nerd Font:bold:size=42}${color1}${time %H:%M}${font}
${alignr}${color2}${time %A · %d %B %Y}${color}
${alignr}${color3}${nodename}  ·  up ${uptime_short}
${color1}${hr 1}${color}
${color2} CPU${color}${alignr}${cpu}%   ${color2}${freq_g}GHz${color}
${color1}${cpubar 6}
${color2} MEM${color}${alignr}${mem} / ${memmax}
${color1}${membar 6}
${color2}󰋊 DISK /${color}${alignr}${fs_used /} / ${fs_size /}
${color1}${fs_bar 6 /}
${color1}${hr 1}${color}
${color2}󰩟 LAN${color}${alignr}${addr wlan0}
${color2}󰄨 DOWN${color} ${downspeed wlan0}${alignr}${color2}UP${color} ${upspeed wlan0}
${color3}${downspeedgraph wlan0 26,120 7aa2f7 bb9af7}${alignr}${upspeedgraph wlan0 26,120 7aa2f7 f7768e}
${color1}${hr 1}${color}
${color4}󰓾 TARGET${color}${alignr}${texeci 5 head -1 ~/.config/hack/target 2>/dev/null || echo '—'}
${color1}󰖂 VPN${color}${alignr}${texeci 5 ~/.local/bin/hackbar vpn plain 2>/dev/null || echo 'down'}
]];
