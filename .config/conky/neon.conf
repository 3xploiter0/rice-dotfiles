conky.config = {
  alignment = 'top_right', gap_x = 24, gap_y = 56,
  own_window = true, own_window_type = 'desktop', own_window_transparent = false,
  own_window_argb_visual = true, own_window_argb_value = 150, own_window_colour = '0f0a1a',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  double_buffer = true, update_interval = 2, minimum_width = 230, maximum_width = 230,
  use_xft = true, font = 'JetBrains Mono:size=9', default_color = 'd8d8e8',
  color1 = 'ff3cc8', color2 = '00c8ff', draw_shades = false, border_inner_margin = 14,
};
conky.text = [[
${font Inter:bold:size=26}${color1}${time %H:%M}${font}
${color2}${time %A, %d %B}${color}
${hr 1}
${color1}HOST${color}${alignr}${nodename}
${color1}KERNEL${color}${alignr}${kernel}
${color1}UPTIME${color}${alignr}${uptime_short}
${hr 1}
${color2}CPU${color}${alignr}${cpu}%
${color1}${cpubar 5}
${color2}RAM${color}${alignr}${mem} / ${memmax}
${color1}${membar 5}
${color2}DISK /${color}${alignr}${fs_used /} / ${fs_size /}
${color1}${fs_bar 5 /}
${hr 1}
${color2}NET${color}${alignr}wlan0
${color1}IP${color}${alignr}${addr wlan0}
${color1}↓${color} ${downspeed wlan0}${alignr}${color1}↑${color} ${upspeed wlan0}
${color2}${downspeedgraph wlan0 22,110 00c8ff ff3cc8}${alignr}${upspeedgraph wlan0 22,110 00c8ff ff3cc8}
]];
