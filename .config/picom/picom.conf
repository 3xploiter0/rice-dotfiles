# Omarchy-style compositor: motion + blur, flat corners, no shadows
backend = "glx";
vsync = true;
use-damage = true;
corner-radius = 0;
shadow = false;
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

blur: { method = "dual_kawase"; strength = 10; };

animations = (
  { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.92; duration = 0.22; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.92; duration = 0.16; },
  { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.2; }
);

rules = (
  { match = "window_type = 'desktop' || window_type = 'dock'"; animations = (); fade = false; blur-background = false; },
  { match = "window_type = 'tooltip' || window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu'"; animations = (); blur-background = false; },
  { match = "class_g = 'Alacritty' || class_g = 'qterminal' || class_g = 'Gnome-terminal' || class_g = 'Rofi'"; blur-background = true; },
  { match = "class_g = 'xfce4-notifyd'"; blur-background = false; }
);
