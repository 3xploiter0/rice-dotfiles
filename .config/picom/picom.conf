# macOS-like glass compositor: blurred menu bar/dock, rounded windows, soft shadows.
backend = "glx";
vsync = true;
use-damage = true;

# Glass surfaces
blur: { method = "dual_kawase"; strength = 6; };
blur-background = true;
blur-background-fixed = true;

# Rounded windows + gentle depth
corner-radius = 12;
shadow = true;
shadow-radius = 18;
shadow-offset-x = 0;
shadow-offset-y = 8;
shadow-opacity = 0.28;
shadow-color = "#000000";

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

animations = (
  # Open: gentle pop-in
  { triggers = [ "open" ]; preset = "appear"; scale = 0.92; duration = 0.22; },
  # Close: shrink + fade in place
  { triggers = [ "close" ]; preset = "disappear"; scale = 0.92; duration = 0.16; },

  # Minimize: genie-style, shrink and slide down into the dock
  {
    triggers = [ "hide" ];
    scale-x = { curve = "cubic-bezier(0.5, 0, 0.9, 0.4)"; duration = 0.3; start = 1; end = 0.08; };
    scale-y = { curve = "cubic-bezier(0.5, 0, 0.9, 0.4)"; duration = 0.3; start = 1; end = 0.08; };
    offset-x = "(1 - scale-x) / 2 * window-width + (window-monitor-width / 2 - window-x - window-width / 2) * (1 - scale-x) / 0.92";
    offset-y = "(1 - scale-y) / 2 * window-height + (window-monitor-height - 40 - window-y - window-height / 2) * (1 - scale-y) / 0.92";
    opacity = { curve = "cubic-bezier(0.5, 0, 0.9, 0.4)"; duration = 0.3; start = "window-raw-opacity-before"; end = 0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
  },

  # Restore: grow back out of the dock
  {
    triggers = [ "show" ];
    scale-x = { curve = "cubic-bezier(0.1, 0.6, 0.5, 1)"; duration = 0.3; start = 0.08; end = 1; };
    scale-y = { curve = "cubic-bezier(0.1, 0.6, 0.5, 1)"; duration = 0.3; start = 0.08; end = 1; };
    offset-x = "(1 - scale-x) / 2 * window-width + (window-monitor-width / 2 - window-x - window-width / 2) * (1 - scale-x) / 0.92";
    offset-y = "(1 - scale-y) / 2 * window-height + (window-monitor-height - 40 - window-y - window-height / 2) * (1 - scale-y) / 0.92";
    opacity = { curve = "cubic-bezier(0.1, 0.6, 0.5, 1)"; duration = 0.3; start = 0; end = "window-raw-opacity"; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    shadow-scale-x = "scale-x"; shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x"; shadow-offset-y = "offset-y";
  },

  # Moving/resizing windows: quick and smooth
  { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.14; }
);

rules = (
  # Full-width menu bar: frosted, no rounding, no shadow.
  { match = "window_type = 'dock' && width >= 1000"; opacity = 0.97; blur-background = true; corner-radius = 0; shadow = false; animations = (); fade = false; },

  # Floating dock: glass pill with rounded corners and a soft shadow.
  { match = "window_type = 'dock' && width < 1000 && height >= 40"; opacity = 0.60; blur-background = true; corner-radius = 22; shadow = true; animations = (); fade = false; },

  # Small panel helper windows stay invisible to blur/shadows.
  { match = "window_type = 'dock' || window_type = 'desktop'"; blur-background = false; shadow = false; animations = (); fade = false; },

  # Terminal windows: opaque so titlebar and body are one seamless surface.
  # Glass stays on the menu bar/dock. Radius matches XFWM4's 10px corner assets.
  { match = "class_g = 'qterminal' || class_g = 'Alacritty' || class_g = 'Gnome-terminal'"; opacity = 1.0; blur-background = true; corner-radius = 10; shadow = true; },

  # Launchers / notifications: frosted, no heavy animation.
  { match = "class_g = 'Rofi' || class_g = 'xfce4-notifyd'"; opacity = 0.88; blur-background = true; corner-radius = 16; shadow = true; animations = (); },

  # Menus/tooltips should stay crisp.
  { match = "window_type = 'tooltip' || window_type *= 'menu'"; blur-background = false; shadow = false; animations = (); fade = false; },

  # Fullscreen windows: no rounded corners.
  { match = "fullscreen"; corner-radius = 0; }
);
