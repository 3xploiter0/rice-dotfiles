# ---- tmux: Catppuccin Mocha hacking setup ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on

# splits that keep the current folder:  prefix + |  and  prefix + -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# move between panes with Alt+arrows (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# reload config: prefix + r
bind r source-file ~/.tmux.conf \; display "tmux reloaded"

# vi-style copy mode that copies to the system clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"

# ---- look ----
set -g status-position bottom
set -g status-interval 3
set -g status-style "bg=#11111b,fg=#bac2de"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#45475a,fg=#89b4fa"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#585b70"

set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold]  #S #[bg=#11111b] "
setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#45475a,fg=#89b4fa,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-separator ""

set -g status-right-length 90
set -g status-right "#(~/.local/bin/hackbar tmux)#[fg=#bac2de,nobold]%H:%M #[bg=#cba6f7,fg=#1e1e2e,bold] #h "

# ---- auto-log every pane to ~/cyber/logs/<date>/ (prefix + L toggles) ----
set-hook -g session-created    'run-shell -b "~/.local/bin/tmux-log start #{pane_id}"'
set-hook -g after-new-window   'run-shell -b "~/.local/bin/tmux-log start #{pane_id}"'
set-hook -g after-split-window 'run-shell -b "~/.local/bin/tmux-log start #{pane_id}"'
bind L run-shell "~/.local/bin/tmux-log toggle #{pane_id}"
